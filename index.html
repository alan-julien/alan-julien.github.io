<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2c2a54">
<meta name="robots" content="noindex">
<title>Mes pages — Alan Julien</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,500;0,600;1,500;1,600&family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--paper:#f7f5ee;--indigo:#2c2a54;--chataigne:#8a5137;--ink:#2c2723;--text-2:#6b6258;--text-3:#9a9084;--border:#e2dccf;--surface:#fbfaf5;--on-indigo:#eef0f7;--on-indigo-muted:#a9abc4}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.6 'Sora',system-ui,sans-serif}
  header{background:var(--indigo);color:var(--on-indigo);padding:40px 20px 32px}
  .wrap{max-width:720px;margin:0 auto}
  .kicker{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--on-indigo-muted)}
  h1{font-family:'Cormorant',Georgia,serif;font-weight:600;font-size:44px;line-height:1.08;margin:6px 0 0}
  h1 em{font-weight:500}
  main{padding:24px 20px 48px}
  a.card{display:block;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-bottom:12px}
  a.card:hover,a.card:focus-visible{border-color:var(--indigo)}
  .card .tag{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--chataigne)}
  .card h2{font-size:20px;font-weight:600;line-height:1.3;margin:2px 0 4px;color:var(--indigo)}
  .card p{margin:0;font-size:15px;color:var(--text-2)}
  .card .url{display:block;margin-top:8px;font-size:12px;color:var(--text-3);word-break:break-all}
  footer{font-size:12px;color:var(--text-3);text-align:center;padding-bottom:32px}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="kicker">Alan Julien</div>
  <h1>Mes <em>pages</em></h1>
</div></header>
<main class="wrap" id="liste"></main>
<footer>Sommaire de mes pages publiées sur GitHub Pages</footer>
<script>
// Ajouter une ligne par nouvelle page publiée (la plus récente en haut).
const PAGES = [
  {titre:"Dans leurs pas — Paris", tag:"Carte · Histoire", url:"https://alan-julien.github.io/paris-grands-hommes/",
   desc:"Carte interactive des lieux parisiens de Pétrarque, Voltaire, Lamartine et Albert le Grand, avec un encadré historique par lieu et une balade conseillée."},
  {titre:"Les bonnes adresses — Paris shopping", tag:"Carte · Shopping", url:"https://alan-julien.github.io/paris-shopping/",
   desc:"Carte interactive des meilleurs coins shopping de Paris."},
  {titre:"La science des couleurs", tag:"Tutoriel · Couleurs", url:"https://alan-julien.github.io/science-des-couleurs/",
   desc:"Tutoriel interactif en 9 étapes : lumière, perception, teinte/valeur/chroma, les 12 saisons de la colorimétrie et les réglages d'une photo, avec curseurs et défis."},
  {titre:"L’art d’assortir", tag:"Atelier · Vêtements", url:"https://alan-julien.github.io/art-d-assortir/",
   desc:"Apprendre à assortir ses vêtements avec sa palette de saisons : neutres et capsule, roue des harmonies, 60/30/10, matières et motifs, règles et mythes, cabine d’essayage jugée, jeu et lookbook par occasion."}
];
document.getElementById('liste').innerHTML = PAGES.map(p => `
  <a class="card" href="${p.url}">
    <div class="tag">${p.tag}</div>
    <h2>${p.titre}</h2>
    <p>${p.desc}</p>
    <span class="url">${p.url.replace('https://','')}</span>
  </a>`).join('');
</script>
</body>
</html>
